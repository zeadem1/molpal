[general]
output-dir = molpal_10k1
--write-intermediate
--write-final
--retrain-from-scratch

[pool]
library = libraries/Enamine10k.csv.gz
invalid-idxs = []

[model]
model = dmpn
conf-method = mve

[acquisition]
metric = md_ei # the default metric is greedy
beta = 2

[encoder]
fingerprint = pair
length = 2048
radius = 2

[objective]
objective = lookup
objective-config = examples/objective/Enamine10k_lookup.ini
--minimize

[stopping]
top-k = 0.01
window-size = 10
delta = 0.1
max-iters = 5