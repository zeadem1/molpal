name: molpal_5090_dmpnn

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # core scientific
  - numpy>=1.26,<3
  - pandas>=2.0,<3
  - scipy>=1.11,<2
  - scikit-learn>=1.4,<2

  # IO / config
  - configargparse>=1.7,<2
  - h5py>=3.11,<4
  - psutil>=5.9
  - pyarrow>=17,<20
  - pyyaml>=6,<7

  # chemistry
  - rdkit>=2024.03

  # utilities
  - tabulate>=0.9,<1
  - tqdm>=4.66,<5

  # pip-only packages
  - pip:
      # PyTorch (from PyPI, ships with CUDA 12.4+, works on RTX 5090 with driver >= 550)
      - torch>=2.6
      - torchvision
      - torchaudio

      # ML training
      - pytorch-lightning>=2.2,<3

      # distributed computing
      - ray[default]>=2.9,<3
